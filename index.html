<!DOCTYPE html>
<html>
<head>
  
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="center">

  <div class="card">
    <h2>Login Admin</h2>
    <input type="password" id="senha"
    placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>

  <script>
    function login() {
      const senha = document.getElementById('senha').value;
      if (senha === '1234') {
        window.location.href = 'admin.html';
      } else {
        alert('Senha incorreta!');
      }
    }
  </script>
</body>
</html>


<!DOCTYPE html>
<html>
<head>
  
  <title>Admin</title>
  <link rel="stylesheet" href="style.css">

  <script
  src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script
  src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <body>

    <h1>Painel de Reservas</h1>
    <ul id="adminlista"></ul>

    <script src="firebase.js"></script>

    <script>
      const lista =
      document.getElementById('adminlista');

      async function carregar() {
        lista.innerHTML = '';
        const snapshot = await db.collection('reservas').get();
        snapshot.forEach(doc => {
          const r = doc.data();
          const li = document.createElement('li');
          li.innerHTML = `${r.nome} - ${r.entrada} até ${r.saida}`;
          li.innerHTML = `<button onclick="remover('${doc.id}')">Excluir</button>`;
          lista.appendChild(li);
        });
      }
      async function remover(id) {
        await db.collection('reservas').doc(id).delete();
        carregar();
      }
      carregar();
    </script>


  </body>
  </html>
